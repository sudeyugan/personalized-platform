name: Manual Windows Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Intentionally does not run tests, lint, typecheck, or documentation gates.
      - name: Build Tauri release
        run: pnpm release:build

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: yiyu-windows-release
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/yiyu.exe
          if-no-files-found: error
          retention-days: 14
