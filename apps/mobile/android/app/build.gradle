plugins { id 'com.android.application' }
android {
    namespace 'com.yiyu.mobile'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'com.yiyu.mobile'; minSdk 26; targetSdk 35; versionCode 3; versionName '0.3.0-preview' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/yiyuAssets')
    sourceSets.main.res.srcDir layout.buildDirectory.dir('generated/yiyuResources')
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
tasks.register('prepareYiyuAssets', Sync) {
    doFirst {
        if (!file('../../dist/index.html').exists()) throw new GradleException('请先在仓库根运行 pnpm mobile:build')
    }
    from('../../dist') { into 'web' }
    into layout.buildDirectory.dir('generated/yiyuAssets')
}
tasks.register('prepareYiyuResources', Sync) {
    from('../../../desktop/src-tauri/icons/android')
    into layout.buildDirectory.dir('generated/yiyuResources')
}
tasks.named('preBuild').configure { dependsOn 'prepareYiyuAssets', 'prepareYiyuResources' }
