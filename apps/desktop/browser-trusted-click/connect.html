<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>可信登录点击 · 连接</title><link rel="stylesheet" href="style.css"></head><body class="setup-page"><small>一隅 · 可选组件</small><h1>只为已授权登录点击一次</h1><p>此组件有较强的浏览器调试权限。程序只派发登录按钮的可信点击，不读取密码、Cookie、网络、DOM或页面正文；网站范围由原只读扩展和一隅当前任务再次检查。</p><section><p id="reader"></p><button id="confirm" disabled>连接这个只读扩展</button><button id="disconnect" class="quiet">解除连接</button><p id="status" role="status"></p></section><footer>关闭使用可在原扩展弹窗操作；撤销调试权限请在Edge停用或删除此组件。原只读扩展不受影响。</footer><script type="module" src="connect.js"></script></body></html>
