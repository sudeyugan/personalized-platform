<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小鱼浏览器连接</title><link rel="stylesheet" href="popup.css"></head>
<body><header><small>一隅 · Edge</small><h1>把当前浏览器交给小鱼读取</h1></header>
<p>只在你发出任务时读取授权网站；使用此配置现有登录状态，不导出Cookie或密码。页面文字可能由一隅中配置的模型处理。</p>
<section><label for="code">一隅中的连接码</label><input id="code" type="password" maxlength="64" autocomplete="off" placeholder="从设置中复制，10分钟内有效"><button id="connect">连接一隅</button><button id="disconnect" class="quiet">忘记本机连接</button></section>
<section><h2>网站范围</h2><p>统一在一隅的「Edge浏览器连接」添加或删除网站。这里无需重复输入；新增后会自动打开确认页。</p><button id="pending">打开待确认连接</button><div id="sites"></div></section>
<section><h2>登录接续 · 可选组件</h2><label class="trusted-login-option"><input id="trustedLogin" type="checkbox">使用可信登录点击</label><small id="trustedLoginStatus" role="status"></small><button id="connectTrusted">连接可信点击组件</button><p>原只读扩展没有调试权限。可选组件需你独立安装，调试权限本身较强；仅对当前逐站允许的登录任务短暂点击，不读取密码、Cookie、网络或页面正文。关闭此处停止使用；撤销浏览器权限请在Edge停用组件。验证码与二次验证仍由你处理。</p></section>
<p id="status" role="status"></p><footer>可随时撤销；不查看无痕页面。默认只读，页面导航与登录须另行授权。</footer><script type="module" src="popup.js"></script></body></html>
